<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: an investigation board. A fixed top bar, an infinite pannable board of group regions holding actor cards, and a detail drawer (right on desktop, bottom sheet on phones). */
:root {
  --bg: #e9edf1; --dot: #c9d1d9; --surface: #ffffff; --surface-2: #f4f6f8;
  --ink: #15212c; --muted: #5a6875; --line: #cfd6dd; --accent: #0a6a93; --accent-ink: #ffffff;
  --sus: #a3660a;
  --g-ru: #b8352a; --g-cn: #b86e00; --g-kp: #7a4cb5; --g-ir: #2c8152; --g-ot: #1d7488;
  --g-rw: #a8304f; --g-cc: #7f6a1e; --g-sp: #93408a; --g-ns: #687480; --g-nc: #687480;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --shadow: 0 1px 2px rgba(20,33,44,.08), 0 4px 14px rgba(20,33,44,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --dot: #1f2a34; --surface: #17212a; --surface-2: #1d2832;
  --ink: #e2e8ee; --muted: #94a2af; --line: #2b3844; --accent: #5ab8e0; --accent-ink: #06151d; --sus: #e2a547;
  --g-ru: #ec6f62; --g-cn: #f0a53a; --g-kp: #b08ae8; --g-ir: #5fc48c; --g-ot: #4fb8cc;
  --g-rw: #e46b8c; --g-cc: #cdb25a; --g-sp: #d27ccb; --g-ns: #8d99a5; --g-nc: #8d99a5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141a; --dot: #1f2a34; --surface: #17212a; --surface-2: #1d2832;
  --ink: #e2e8ee; --muted: #94a2af; --line: #2b3844; --accent: #5ab8e0; --accent-ink: #06151d; --sus: #e2a547;
  --g-ru: #ec6f62; --g-cn: #f0a53a; --g-kp: #b08ae8; --g-ir: #5fc48c; --g-ot: #4fb8cc;
  --g-rw: #e46b8c; --g-cc: #cdb25a; --g-sp: #d27ccb; --g-ns: #8d99a5; --g-nc: #8d99a5;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; margin: 0; white-space: nowrap; }
.brand .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 8px 0; outline: none; }
.search .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 12.5px/1 var(--f-body); letter-spacing: .02em; padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.navlinks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.navlinks a { text-decoration: none; }
.navlinks a:hover { text-decoration: underline; }

/* board */
.board { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; }
.board.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges line { stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 6 5; opacity: .85; }

.group { position: absolute; width: 1490px; padding: 18px 22px 24px; border-radius: 14px;
  background: color-mix(in srgb, var(--gc) 7%, transparent); border: 1.5px solid color-mix(in srgb, var(--gc) 35%, transparent); }
.group > h2 { margin: 0 0 18px; font-family: var(--f-display); font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: .01em; color: var(--gc); display: flex; align-items: baseline; gap: 12px; }
.group > h2 small { font-family: var(--f-mono); font-weight: 500; font-size: 26px; color: var(--muted); }
.cols { display: flex; gap: 18px; align-items: flex-start; }
.col { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 12px; box-shadow: var(--shadow); cursor: pointer; transition: opacity .15s, box-shadow .15s, transform .15s; }
.card:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gc) 55%, transparent), var(--shadow); }
.card.sel { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.card.rel { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 60%, transparent), var(--shadow); }
.card.dim { opacity: .22; }
.card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 23px; line-height: 1.1; text-wrap: balance; }
.badge { font-family: var(--f-mono); font-size: 12px; padding: 3px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-decoration: none; }
a.badge { color: var(--ink); }
.alias { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.country { margin: 8px 0 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.country .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gc); flex: none; transform: translateY(-1px); }
.cves { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 5px; }
.cves a, .cves span { font-family: var(--f-mono); font-size: 12px; padding: 3px 6px; border-radius: 4px; text-decoration: none; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); display: inline-block; }
.cves a.sus { border-style: dashed; border-color: var(--sus); color: var(--sus); background: color-mix(in srgb, var(--sus) 7%, var(--surface)); }
.cves a:hover { text-decoration: underline; }
.cves .more { color: var(--muted); border-color: var(--line); background: transparent; }
.card footer { margin-top: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.none { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

.hubs { position: absolute; padding: 18px 22px 24px; border-radius: 14px; border: 1.5px dashed var(--line); }
.hubs > h2 { margin: 0 0 18px; font-family: var(--f-display); font-size: 64px; line-height: 1; font-weight: 700; }
.hubs .row { display: flex; gap: 16px; flex-wrap: wrap; width: 1446px; }
.hub { width: 350px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; box-shadow: var(--shadow); }
.hub a.id { font-family: var(--f-mono); font-size: 16px; font-weight: 500; }
.hub p { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
.hub button { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 4px; padding: 3px 7px; margin: 0 4px 4px 0; cursor: pointer; }

/* zoom controls */
.zoom { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.zoom button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 18px var(--f-body); cursor: pointer; box-shadow: var(--shadow); }
.zoom .pct { font-family: var(--f-mono); font-size: 11px; text-align: center; color: var(--muted); }
.hint { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; z-index: 4; max-width: calc(100% - 100px); }

/* drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); z-index: 6; overflow-y: auto; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.drawer .close { position: sticky; top: 0; float: right; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; }
.drawer .eyebrow { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--gc); margin: 0; }
.drawer h2 { font-family: var(--f-display); font-size: 34px; line-height: 1.05; margin: 4px 0 4px; text-wrap: balance; }
.drawer .alias { -webkit-line-clamp: unset; font-size: 14px; }
.drawer h4 { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; margin: 14px 0 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.clist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.clist li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; font-size: 13.5px; }
.clist a { font-family: var(--f-mono); font-size: 13px; }
.clist .q { grid-column: 2; color: var(--sus); font-size: 12.5px; }
.clist .v { color: var(--muted); }
.techs { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.techs a { font-family: var(--f-mono); font-size: 12.5px; text-decoration: none; display: inline-block; min-width: 82px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags code { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.ctx { font-size: 14.5px; line-height: 1.5; margin: 0; }
.rel button { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 4px; padding: 4px 8px; margin: 0 5px 5px 0; cursor: pointer; }
.drawer .src { margin-top: 20px; font-size: 13.5px; }

@media (max-width: 720px) {
  .brand .meta, .navlinks { display: none; }
  .drawer { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>

<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, html) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ext = (href, text, cls = '') => `<a href="${esc(href)}" target="_blank" rel="noopener"${cls ? ` class="${cls}"` : ''}>${text}</a>`;

  const TITLES = { ru: 'Russia', cn: 'China', kp: 'North Korea', ir: 'Iran · Gulf · South Asia', ot: 'Other / unattributed state actors',
    rw: 'Ransomware & extortion', cc: 'Cybercrime, botnets & campaigns', sp: 'Commercial spyware vendors',
    ns: 'State actors in the news, no CVE match', nc: 'Cybercrime in the news, no CVE match' };
  const ROWS = [['ru', 'cn', 'kp', 'ir', 'ot'], ['rw', 'cc', 'sp', 'ns', 'nc']];
  const TYPES = [['all', 'All'], ['apt', 'APT'], ['ransomware', 'Ransomware'], ['crime', 'Cybercrime'], ['spyware-vendor', 'Spyware'], ['cve', 'With CVEs']];
  const CRIME = new Set(['cybercrime', 'campaign', 'botnet', 'access-broker', 'extortion', 'fraud', 'phishing-kit', 'supply-chain', 'hacktivist']);
  const byId = Object.fromEntries(D.actors.map(a => [a.id, a]));
  const linked = D.actors.filter(a => a.cves.length);
  const nLinks = linked.reduce((n, a) => n + a.cves.length, 0);
  $('#meta').textContent = `${D.actors.length} actors · ${nLinks} actor→CVE links · updated ${D.updated.split('-').reverse().join('/')}`;
  $('#nav').innerHTML = [ext(D.links.index, 'Index'), ext(D.links.state, 'State-nexus'), ext(D.links.crime, 'Cybercrime'), ext(D.links.cveindex, 'CVE-Report'), ext(D.links.home, 'Koffei')].join('');

  // CVE -> actors
  const share = {};
  linked.forEach(a => a.cves.forEach(c => (share[c.id] = share[c.id] || { c, actors: [] }).actors.push(a.id)));
  const related = id => { const s = new Set(); byId[id].cves.forEach(c => share[c.id].actors.forEach(x => x !== id && s.add(x))); return [...s]; };

  // ---------- render board
  const world = $('#world'), board = $('#board'), edges = $('#edges');
  const cards = {};
  function cardHTML(a) {
    const max = 8, list = a.cves.slice(0, max).map(c => `<li>${ext(c.url, c.id, c.q ? 'sus' : '')}</li>`).join('')
      + (a.cves.length > max ? `<li><span class="more">+${a.cves.length - max}</span></li>` : '');
    const m = a.mitre ? ext(a.mitre.url, a.mitre.id, 'badge') : `<span class="badge">${a.mapped ? 'mapped' : 'no ATT&amp;CK'}</span>`;
    const foot = [a.techs.length ? `${a.techs.length} techniques` : '', a.seen.length ? `seen in ${a.seen.length} daily note${a.seen.length > 1 ? 's' : ''}` : '', a.kind ? esc(a.kind) : ''].filter(Boolean).join('</span><span>');
    return `<header><h3>${esc(a.name)}</h3>${m}</header>${a.alias ? `<p class="alias">${esc(a.alias)}</p>` : ''}
      <p class="country"><span class="dot"></span><span>${esc(a.country)}</span></p>
      ${a.cves.length ? `<ul class="cves">${list}</ul>` : `<p class="none">No CVE in the CVE-Report${a.notin.length ? ` (${a.notin.join(', ')} not in report)` : ''}</p>`}
      ${foot ? `<footer><span>${foot}</span></footer>` : ''}`;
  }
  const groupEls = {};
  ROWS.flat().forEach(k => {
    const members = D.actors.filter(a => a.g === k);
    const g = el('section', { class: 'group', style: `--gc: var(--g-${k})`, 'aria-label': TITLES[k] });

    const colsWrap = el('div', { class: 'cols' }); const cols = [0, 1, 2].map(() => colsWrap.appendChild(el('div', { class: 'col' })));
    g.appendChild(colsWrap); world.appendChild(g); groupEls[k] = g;
    members.forEach(a => {
      const c = el('article', { class: 'card', tabindex: '0', 'data-id': a.id, style: `--gc: var(--g-${k})`, 'aria-label': a.name });
      c.innerHTML = cardHTML(a);
      const col = cols.reduce((m, x) => x.offsetHeight < m.offsetHeight ? x : m, cols[0]);
      col.appendChild(c); cards[a.id] = c;
    });
  });
  // hubs
  const top = Object.values(share).filter(s => s.actors.length >= 3).sort((x, y) => y.actors.length - x.actors.length || x.c.id.localeCompare(y.c.id));

  world.appendChild(hubs);

  function layout() {
    let y = 0, maxX = 0;
    ROWS.forEach(row => {
      let x = 0, h = 0;
      row.forEach(k => { const g = groupEls[k]; g.style.left = x + 'px'; g.style.top = y + 'px'; x += g.offsetWidth + 80; h = Math.max(h, g.offsetHeight); });
      maxX = Math.max(maxX, x); y += h + 90;
    });
    hubs.style.left = '0px'; hubs.style.top = y + 'px';
    world.style.width = maxX + 'px'; world.style.height = (y + hubs.offsetHeight) + 'px';
    edges.setAttribute('width', maxX); edges.setAttribute('height', y + hubs.offsetHeight);
  }
  layout();

  // ---------- pan / zoom
  let s = 1, tx = 0, ty = 0;
  const pct = $('#pct');
  const apply = () => { world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; pct.textContent = Math.round(s * 100) + '%'; };
  const clamp = v => Math.min(2.5, Math.max(0.06, v));
  function zoomAt(f, cx, cy) { const ns = clamp(s * f); const k = ns / s; tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k; s = ns; apply(); }
  function fit(rect) {
    const bw = board.clientWidth, bh = board.clientHeight;
    const r = rect || { x: 0, y: 0, w: world.offsetWidth, h: world.offsetHeight };
    s = clamp(Math.min((bw - 40) / r.w, (bh - 40) / r.h)); tx = (bw - r.w * s) / 2 - r.x * s; ty = (bh - r.h * s) / 2 - r.y * s; apply();
  }
  function focusCard(id) {
    const c = cards[id]; const wr = world.getBoundingClientRect(), cr = c.getBoundingClientRect();
    const x = (cr.left - wr.left) / s, y = (cr.top - wr.top) / s, w = cr.width / s, h = cr.height / s;
    const bw = board.clientWidth, bh = board.clientHeight, open = !$('#drawer').hidden && bw > 720 ? 440 : 0;
    s = clamp(Math.min(1, (bw - open - 80) / (w * 2.2))); tx = (bw - open) / 2 - (x + w / 2) * s; ty = (bh * (bw > 720 ? 1 : 0.38)) / 2 - (y + h / 2) * s; apply();
  }
  board.addEventListener('wheel', e => {
    e.preventDefault(); const r = board.getBoundingClientRect();
    if (!e.ctrlKey && Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.6 && e.deltaMode === 0 && Math.abs(e.deltaX) > 2) { tx -= e.deltaX; ty -= e.deltaY; apply(); return; }
    const d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY; zoomAt(Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  const ptrs = new Map(); let moved = 0, pinch0 = null;
  board.addEventListener('pointerdown', e => {
    if (e.target.closest('.drawer,.zoom,a,button,input')) return;
    board.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0;
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s }; }
    board.classList.add('dragging');
  });
  board.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return; const p = ptrs.get(e.pointerId); const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const r = board.getBoundingClientRect();
      zoomAt((pinch0.s * d / pinch0.d) / s, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); moved += 10; return; }
    moved += Math.abs(dx) + Math.abs(dy); tx += dx; ty += dy; apply();
  });
  const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null; if (!ptrs.size) board.classList.remove('dragging'); };
  board.addEventListener('pointerup', e => {
    const wasClick = moved < 6 && ptrs.size === 1; up(e);
    if (!wasClick) return;
    const c = document.elementFromPoint(e.clientX, e.clientY)?.closest('.card');
    if (c) select(c.dataset.id); else if (!e.target.closest('.drawer')) select(null);
  });
  board.addEventListener('pointercancel', up);
  board.addEventListener('click', e => { if (moved >= 6 && e.target.closest('a')) e.preventDefault(); const go = e.target.closest('[data-go]'); if (go) { select(go.dataset.go); focusCard(go.dataset.go); } }, true);
  $('#zin').onclick = () => zoomAt(1.25, board.clientWidth / 2, board.clientHeight / 2);
  $('#zout').onclick = () => zoomAt(0.8, board.clientWidth / 2, board.clientHeight / 2);
  $('#zfit').onclick = () => fit();

  // ---------- selection + drawer
  let selected = null;
  function drawEdges(id) {
    edges.innerHTML = ''; if (!id) return;
    const wr = world.getBoundingClientRect(); const ctr = c => { const r = c.getBoundingClientRect(); return [(r.left - wr.left + r.width / 2) / s, (r.top - wr.top + r.height / 2) / s]; };
    const [x1, y1] = ctr(cards[id]);
    related(id).forEach(r => { const [x2, y2] = ctr(cards[r]); const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2); edges.appendChild(l); });
  }
  function select(id) {
    selected = id; const rel = id ? new Set(related(id)) : new Set();
    Object.entries(cards).forEach(([k, c]) => { c.classList.toggle('sel', k === id); c.classList.toggle('rel', rel.has(k)); });
    drawEdges(id); renderDrawer(id);
    try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (_) {}
  }
  function renderDrawer(id) {
    const d = $('#drawer'); if (!id) { d.hidden = true; return; }
    const a = byId[id]; d.style.setProperty('--gc', `var(--g-${a.g})`);
    const rel = related(id);
    d.innerHTML = `<button class="close" id="dclose" aria-label="Close details">×</button>
      <p class="eyebrow">${esc(TITLES[a.g])}</p><h2>${esc(a.name)}</h2>${a.alias ? `<p class="alias">${esc(a.alias)}</p>` : ''}
      <dl class="kv"><dt>Country</dt><dd>${esc(a.country)}</dd><dt>Type</dt><dd>${esc(a.kind || a.type.replace(/-/g, ' '))}</dd>
      <dt>MITRE</dt><dd>${a.mitre ? ext(a.mitre.url, (a.mitre.id.startsWith('C') ? 'Campaign ' : 'Group ') + a.mitre.id) : (a.mapped ? 'Not in ATT&amp;CK, techniques mapped from reporting' : 'Not in ATT&amp;CK')}</dd></dl>
      <h4>CVEs in the CVE-Report (${a.cves.length})</h4>
      ${a.cves.length ? `<ul class="clist">${a.cves.map(c => `<li>${ext(c.url, c.id)}<span class="v">${esc(c.vendor)} · ${esc(c.note.replace('CVE-Report-', ''))}</span>${c.q ? `<span class="q">${esc(c.q)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="none" style="margin:0">None.</p>'}
      ${a.notin.length ? `<p class="none">Known but not in the report: ${a.notin.map(esc).join(', ')}</p>` : ''}
      ${rel.length ? `<h4>Shares CVEs with</h4><div class="rel">${rel.map(r => `<button data-go="${r}">${esc(byId[r].name)}</button>`).join('')}</div>` : ''}
      ${a.ctx && a.ctx !== '—' ? `<h4>Context</h4><p class="ctx">${esc(a.ctx)}</p>` : ''}
      ${a.techs.length ? `<h4>ATT&amp;CK v19 techniques${a.mapped ? ' (mapped)' : ''}</h4><div class="techs">${a.techs.map(t => { const id = t.replace(' (M)', ''); const p = id.split('.');
        const url = 'https://attack.mitre.org/techniques/' + p[0] + (p[1] ? '/' + p[1] : '') + '/'; return `<div>${ext(url, esc(t))} ${esc(D.legend[id] || '')}</div>`; }).join('')}</div>` : ''}
      ${a.seen.length || a.seenCveNotes ? `<h4>Seen in Daily CyberNews</h4><div class="techs" style="flex-direction:row;flex-wrap:wrap;gap:6px 12px">${a.seen.map(x => ext(x.url, x.d.split('-').reverse().join('/'))).join('')}${a.seenCveNotes ? ext(D.links.cveindex, 'CVE-Report notes') : ''}</div>` : ''}
      <h4>Tags</h4><div class="tags">${a.tags.map(t => `<code>${esc(t)}</code>`).join('')}</div>
      <p class="src">Full row: ${ext(a.g === 'rw' || a.g === 'cc' || a.g === 'sp' || a.g === 'nc' ? D.links.crime : D.links.state, a.g === 'rw' || a.g === 'cc' || a.g === 'sp' || a.g === 'nc' ? 'Threat-Actors-Cybercrime-and-Spyware' : 'Threat-Actors-State-Nexus')}</p>`;
    d.hidden = false; d.scrollTop = 0;
    $('#dclose').onclick = () => select(null);
    d.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { select(b.dataset.go); focusCard(b.dataset.go); });
  }
  world.addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(c.dataset.id); focusCard(c.dataset.id); } });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input')) { if (e.key === 'Escape') { e.target.value = ''; filter(); } return; }
    if (e.key === 'Escape') select(null);
    if (e.key === '+' || e.key === '=') $('#zin').click(); if (e.key === '-') $('#zout').click(); if (e.key === '0') fit();
  });

  // ---------- search + filters
  let type = 'all';
  const chips = $('#chips');
  TYPES.forEach(([k, label]) => { const b = el('button', { class: 'chip', 'aria-pressed': k === 'all' ? 'true' : 'false', 'data-k': k }, label); chips.appendChild(b); });
  chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; type = b.dataset.k; chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); filter(); });
  const hay = Object.fromEntries(D.actors.map(a => [a.id, [a.name, a.alias, a.country, a.type, a.kind, a.ctx, a.mitre?.id || '', a.techs.join(' '), a.cves.map(c => c.id + ' ' + c.vendor).join(' '), a.tags.join(' ')].join(' ').toLowerCase()]));
  function match(a, q) {
    const tOk = type === 'all' || (type === 'cve' ? a.cves.length > 0 : type === 'crime' ? CRIME.has(a.type) : a.type === type);
    return tOk && (!q || q.split(/\s+/).every(w => hay[a.id].includes(w)));
  }
  function filter(zoom) {
    const q = $('#q').value.trim().toLowerCase(); let n = 0, first = null;
    D.actors.forEach(a => { const ok = match(a, q); cards[a.id].classList.toggle('dim', !ok); if (ok) { n++; first = first || a.id; } });
    $('#count').textContent = `${n} / ${D.actors.length}`;
    if (zoom && first) { select(first); focusCard(first); }
  }
  $('#q').addEventListener('input', () => filter());
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') filter(true); });

  // ---------- start
  filter();
  const start = () => { layout(); const h = (location.hash || '').slice(1); if (h && byId[h]) { select(h); focusCard(h); } else fit(); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
  start();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (selected) drawEdges(selected); }, 120); });
})();
</script>
