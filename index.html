<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive map of threat actors and APTs with MITRE ATT&amp;CK techniques and the CVEs they exploit, from the Koffei CVE-Report.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Koffei Threat Actor Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: an investigation board. A fixed top bar, an infinite pannable board of group regions holding actor cards, and a detail drawer (right on desktop, bottom sheet on phones).
   Visual style: KDE Plasma Breeze (light) / Breeze Dark — Window/View/Button colours, Noto Sans,
   with a purple accent (rgb 139,46,173) like picking a custom accent colour in Plasma System Settings. */
:root {
  --bg: #eff0f1; --dot: #d1d5d9; --surface: #ffffff; --surface-2: #f7f8f9;
  --ink: #232629; --muted: #5f6a73; --line: #c3c7cb; --accent: #2980b9; --accent-ink: #ffffff;
  --pu: 139,46,173; --link: #1e8449; --hl: #8b2ead; --hl-soft: rgba(139,46,173,.12); --sus: #c45c00;
  --g-ru: #da4453; --g-cn: #d35400; --g-kp: #8e44ad; --g-ir: #1e8449; --g-ot: #2980b9;
  --g-rw: #c0306a; --g-cc: #a67c00; --g-sp: #a0399a; --g-ns: #7f8c8d; --g-nc: #7f8c8d;
  --f-display: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Hack", "Noto Sans Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 5px; --r-frame: 8px;
  --shadow: 0 1px 2px rgba(35,38,41,.10), 0 2px 6px rgba(35,38,41,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141618; --dot: #2a2e32; --surface: #202326; --surface-2: #292c30;
  --ink: #fcfcfc; --muted: #a1a9b1; --line: #3b4045; --accent: #1d99f3; --accent-ink: #fcfcfc;
  --pu: 139,46,173; --link: #2ecc71; --hl: #a24cc4; --hl-soft: rgba(162,76,196,.20); --sus: #f67400;
  --g-ru: #ed5e6b; --g-cn: #f67400; --g-kp: #b07fd8; --g-ir: #2ecc71; --g-ot: #1d99f3;
  --g-rw: #e93a9a; --g-cc: #fdbc4b; --g-sp: #d27ccb; --g-ns: #a1a9b1; --g-nc: #a1a9b1;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141618; --dot: #2a2e32; --surface: #202326; --surface-2: #292c30;
  --ink: #fcfcfc; --muted: #a1a9b1; --line: #3b4045; --accent: #1d99f3; --accent-ink: #fcfcfc;
  --pu: 139,46,173; --link: #2ecc71; --hl: #a24cc4; --hl-soft: rgba(162,76,196,.20); --sus: #f67400;
  --g-ru: #ed5e6b; --g-cn: #f67400; --g-kp: #b07fd8; --g-ir: #2ecc71; --g-ot: #1d99f3;
  --g-rw: #e93a9a; --g-cc: #fdbc4b; --g-sp: #d27ccb; --g-ns: #a1a9b1; --g-nc: #a1a9b1;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
a { color: var(--accent); }
:focus-visible { outline: 1px solid var(--hl); outline-offset: 1px; }
::selection { background: var(--hl); color: #fff; }
.app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 19px; letter-spacing: 0; margin: 0; white-space: nowrap; }
.brand .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0 10px; }
.search:focus-within { border-color: var(--hl); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 8px 0; outline: none; }
.search .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 400 13px/1 var(--f-body); padding: 7px 11px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; box-shadow: var(--shadow); }
.chip:hover { border-color: var(--hl); background: var(--hl-soft); }
.chip[aria-pressed="true"] { background: var(--hl); color: #fff; border-color: var(--hl); }
.navlinks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.navlinks a { text-decoration: none; }
.navlinks a:hover { text-decoration: underline; }

/* board */
.board { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; }
.board.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges line { stroke: var(--hl); stroke-width: 2.5; stroke-dasharray: 6 5; opacity: .85; }
.edges polyline { stroke: var(--link); stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }

.group { position: absolute; width: 1490px; padding: 18px 22px 24px; border-radius: var(--r-frame);
  background: color-mix(in srgb, var(--gc) 6%, transparent); border: 1.5px solid color-mix(in srgb, var(--gc) 35%, transparent); }
.group > h2 { margin: 0 0 18px; font-family: var(--f-display); font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: -.01em; color: var(--gc); display: flex; align-items: baseline; gap: 12px; }
.group > h2 small { font-family: var(--f-mono); font-weight: 500; font-size: 26px; color: var(--muted); }
.cols { display: flex; gap: 18px; align-items: flex-start; }
.col { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-frame); padding: 14px 16px 12px; box-shadow: var(--shadow); cursor: pointer; transition: opacity .15s, box-shadow .15s, transform .15s; }
.card:hover { border-color: var(--hl); background: color-mix(in srgb, var(--hl) 6%, var(--surface)); }
.card.sel { border-color: var(--hl); box-shadow: 0 0 0 2px var(--hl), var(--shadow); }
.card.rel { border-color: color-mix(in srgb, var(--hl) 70%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--hl) 60%, transparent), var(--shadow); }
.card.dim { opacity: .22; }
.card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.1; text-wrap: balance; }
.badge { font-family: var(--f-mono); font-size: 12px; padding: 3px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-decoration: none; }
a.badge { color: var(--ink); }
.alias { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.country { margin: 8px 0 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.country .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gc); flex: none; transform: translateY(-1px); }
.cves { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 5px; }
.cves a, .cves span { font-family: var(--f-mono); font-size: 12px; padding: 3px 6px; border-radius: 4px; text-decoration: none; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); display: inline-block; }
.cves a.sus { border-style: dashed; border-color: var(--sus); color: var(--sus); background: color-mix(in srgb, var(--sus) 7%, var(--surface)); }
.cves a:hover { text-decoration: underline; }
.cves .more { color: var(--muted); border-color: var(--line); background: transparent; }
.card footer { margin-top: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.none { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

.hubs { position: absolute; padding: 18px 22px 24px; border-radius: var(--r-frame); border: 1.5px dashed var(--line); }
.hubs > h2 { margin: 0 0 18px; font-family: var(--f-display); font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -.01em; }
.hubs .row { display: flex; gap: 16px; flex-wrap: wrap; width: 1446px; }
.hub { width: 350px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-frame); padding: 14px 16px; box-shadow: var(--shadow); }
.hub a.id { font-family: var(--f-mono); font-size: 16px; font-weight: 500; }
.hub p { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
.hub button { font: 400 13px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); padding: 3px 7px; margin: 0 4px 4px 0; cursor: pointer; }

/* zoom controls */
.zoom { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.zoom button { width: 38px; height: 38px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 600 18px var(--f-body); cursor: pointer; box-shadow: var(--shadow); }
.zoom .pct { font-family: var(--f-mono); font-size: 11px; text-align: center; color: var(--muted); }
.hint { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; z-index: 4; max-width: calc(100% - 100px); }

/* Breeze button hover: highlight border + light highlight fill */
.hub button:hover, .rel button:hover, .zoom button:hover, .drawer .close:hover { border-color: var(--hl); background: var(--hl-soft); }
.hub button:active, .rel button:active, .zoom button:active { background: var(--hl); color: #fff; }

/* drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -4px 0 16px rgba(0,0,0,.14); z-index: 6; overflow-y: auto; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.drawer .close { position: sticky; top: 0; float: right; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); width: 32px; height: 32px; font-size: 17px; cursor: pointer; }
.drawer .eyebrow { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--gc); margin: 0; }
.drawer h2 { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.05; margin: 4px 0 4px; text-wrap: balance; }
.drawer .alias { -webkit-line-clamp: unset; font-size: 14px; }
.drawer h4 { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; margin: 14px 0 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.clist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.clist li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; font-size: 13.5px; }
.clist a { font-family: var(--f-mono); font-size: 13px; }
.clist .q { grid-column: 2; color: var(--sus); font-size: 12.5px; }
.clist .v { color: var(--muted); }
.techs { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.techs a { font-family: var(--f-mono); font-size: 12.5px; text-decoration: none; display: inline-block; min-width: 82px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags code { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.ctx { font-size: 14.5px; line-height: 1.5; margin: 0; }
.rel button { font: 400 13px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); padding: 4px 8px; margin: 0 5px 5px 0; cursor: pointer; }
.drawer .src { margin-top: 20px; font-size: 13.5px; }


/* Purple accent: fading gradients on buttons and blocks */
.chip, .zoom button, .hub button, .rel button, .drawer .close {
  background: linear-gradient(180deg, rgba(var(--pu),.16), rgba(var(--pu),.03)), var(--surface-2);
  border-color: color-mix(in srgb, var(--hl) 35%, var(--line)); }
.chip:hover, .zoom button:hover, .hub button:hover, .rel button:hover, .drawer .close:hover {
  background: linear-gradient(180deg, rgba(var(--pu),.30), rgba(var(--pu),.08)), var(--surface-2); border-color: var(--hl); }
.chip[aria-pressed="true"], .hub button:active, .rel button:active, .zoom button:active {
  background: linear-gradient(180deg, #a347c7, #8b2ead 60%, #74238f); color: #fff; border-color: #74238f; }
.card, .hub { background: linear-gradient(180deg, rgba(var(--pu),.10), rgba(var(--pu),0) 60%), var(--surface); }
.card:hover { background: linear-gradient(180deg, rgba(var(--pu),.18), rgba(var(--pu),.02) 70%), var(--surface); }
.card.sel { background: linear-gradient(180deg, rgba(var(--pu),.22), rgba(var(--pu),.04) 70%), var(--surface); }
.hubs { border-color: color-mix(in srgb, var(--hl) 40%, var(--line)); background: linear-gradient(180deg, rgba(var(--pu),.07), rgba(var(--pu),0) 40%); }
.drawer { background: linear-gradient(180deg, rgba(var(--pu),.12), rgba(var(--pu),0) 220px), var(--surface); }
.search, .hint { background: linear-gradient(180deg, rgba(var(--pu),.05), rgba(var(--pu),0)), var(--surface); }
.badge, .tags code { background: linear-gradient(180deg, rgba(var(--pu),.12), rgba(var(--pu),.03)), var(--surface-2); }


/* world map: actor origin countries */
.geo { position: absolute; left: 16px; top: 16px; width: 420px; min-width: 260px; max-width: calc(100% - 32px); z-index: 7; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-frame); box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 0 10px 9px; --land: color-mix(in srgb, var(--ink) 13%, var(--surface)); }
.geo h3 { margin: 0 -10px 6px; padding: 7px 8px 7px 12px; font: 600 13px var(--f-body); display: flex; align-items: center; gap: 8px; cursor: move; touch-action: none; user-select: none; border-bottom: 1px solid var(--line); border-radius: var(--r-frame) var(--r-frame) 0 0; background: color-mix(in srgb, var(--hl) 8%, var(--surface)); }
.geo h3 span { flex: 1; }
.geo h3 small { font: 400 11.5px var(--f-mono); color: var(--muted); }
.geo h3 button { width: 26px; height: 26px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); cursor: pointer; font-size: 15px; line-height: 1; }
.geo h3 button:hover { border-color: var(--hl); background: var(--hl-soft); }
.geo .grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none;
  background: linear-gradient(135deg, transparent 0 55%, var(--muted) 55% 61%, transparent 61% 72%, var(--muted) 72% 78%, transparent 78%); border-bottom-right-radius: var(--r-frame); }
.geo.dragging { opacity: .92; } .geo.dragging, .geo.sizing { user-select: none; }
.geo-on { position: absolute; left: 16px; top: 16px; z-index: 5; display: flex; align-items: center; gap: 8px; font: 600 13.5px var(--f-body); color: var(--ink); cursor: pointer;
  padding: 9px 14px 9px 11px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--hl) 55%, var(--line)); box-shadow: var(--shadow);
  background: linear-gradient(110deg, var(--surface) 0 40%, color-mix(in srgb, var(--hl) 22%, var(--surface)) 50%, var(--surface) 60% 100%) 0 0 / 300% 100%, var(--surface);
  animation: geo-shine 3.2s ease-in-out infinite, geo-pulse 2.4s ease-in-out infinite; }
.geo-on svg { color: var(--hl); }
.geo-on:hover { border-color: var(--hl); }
.geo-on small { font-weight: 400; color: var(--muted); }
@keyframes geo-shine { 0% { background-position: 100% 0, 0 0; } 60%, 100% { background-position: 0 0, 0 0; } }
@keyframes geo-pulse { 0%, 100% { box-shadow: var(--shadow), 0 0 0 0 color-mix(in srgb, var(--hl) 45%, transparent); } 50% { box-shadow: var(--shadow), 0 0 0 7px color-mix(in srgb, var(--hl) 0%, transparent); } }
@media (prefers-reduced-motion: reduce) { .geo-on { animation: none; } }
.geo .stage { position: relative; }
.geo svg { width: 100%; height: auto; display: block; touch-action: none; cursor: grab; border-radius: 6px; background: color-mix(in srgb, var(--accent) 5%, var(--surface)); }
.geo svg.panning { cursor: grabbing; }
.geo path { vector-effect: non-scaling-stroke; }
.geo .mz { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 4px; }
.geo .mz button { width: 26px; height: 26px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); cursor: pointer; font: 600 14px var(--f-body); line-height: 1; padding: 0; box-shadow: var(--shadow); }
.geo .mz button:hover { border-color: var(--hl); background: var(--hl-soft); }
.geo path { fill: var(--land); stroke: var(--surface); stroke-width: .5; }
.geo path.has, .geo path.soft { cursor: pointer; }
.geo path.l1 { fill: color-mix(in srgb, var(--hl) 32%, var(--land)); }
.geo path.l2 { fill: color-mix(in srgb, var(--hl) 52%, var(--land)); }
.geo path.l3 { fill: color-mix(in srgb, var(--hl) 72%, var(--land)); }
.geo path.l4 { fill: var(--hl); }
.geo path.soft { fill: url(#geo-hatch); }
.geo path.soft, .geo path.has.sx { stroke: var(--hl); stroke-width: 1; stroke-dasharray: 2.5 1.5; }
.geo path.on { fill: var(--link); stroke: var(--ink); stroke-width: .8; stroke-dasharray: none; }
.geo path.onsoft { fill: url(#geo-hatch-on); stroke: var(--link); stroke-width: 1.8; stroke-dasharray: 3 2; }
.geo path.also { fill: color-mix(in srgb, var(--link) 45%, var(--land)); stroke: var(--link); stroke-width: 2; stroke-dasharray: none; }
.geo path.has.also { fill: color-mix(in srgb, var(--link) 45%, var(--hl)); }
.geo path.pick { stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: none; }
.geo path:hover { stroke: var(--ink); stroke-width: 1; }
#geo-hatch rect { fill: var(--land); } #geo-hatch line { stroke: var(--hl); stroke-width: 2; }
#geo-hatch-on rect { fill: var(--land); } #geo-hatch-on line { stroke: var(--link); stroke-width: 2.4; }
.geo .cap { margin: 4px 0 0; font-size: 12.5px; line-height: 1.35; min-height: 2.7em; }
.geo .cap button { font: 400 12px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); padding: 1px 6px; margin-left: 6px; cursor: pointer; }
.geo .key { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.geo .key i { display: inline-block; width: 12px; height: 9px; margin-right: 4px; vertical-align: -1px; border-radius: 2px; }
.geo .key .k1 { background: var(--hl); }
.geo .key .k2 { background: repeating-linear-gradient(45deg, var(--hl) 0 2px, var(--land) 2px 4px); outline: 1px dashed var(--hl); }
.geo .key .k3 { background: var(--link); }
.geo .key .k4 { background: color-mix(in srgb, var(--link) 30%, var(--land)); outline: 1.5px solid var(--link); }
@media (max-width: 720px) { .geo .key { display: none; } .geo-on small { display: none; } }

@media (max-width: 720px) {
  .brand .meta, .navlinks { display: none; }
  .drawer { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: var(--r-frame) var(--r-frame) 0 0; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>


<div class="app">
  <div class="bar">

<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, attrs = {}, html) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ext = (href, text, cls = '') => `<a href="${esc(href)}" target="_blank" rel="noopener"${cls ? ` class="${cls}"` : ''}>${text}</a>`;
  // Deep link to the actor's row: the section heading (Publish scrolls to it), plus a text fragment
  // (#:~:text=) so browsers that support it jump to and highlight the row itself.
  const ROW_CRIME = new Set(['rw', 'cc', 'sp', 'nc']);
  const ROW_SECTION = { ru: '🇷🇺 Russia', cn: '🇨🇳 China', kp: '🇰🇵 North Korea', ir: '🇮🇷 Iran / 🇦🇪 Gulf', ot: '🌐 Other or unattributed state-level actors',
    ns: 'Actors seen in Daily CyberNews with no CVE-Report match', rw: 'Ransomware and extortion groups with a CVE-Report match',
    cc: 'Financially motivated groups, botnets and named campaigns with a CVE-Report match', sp: 'Commercial surveillance vendors (spyware)',
    nc: 'Cybercrime actors seen in Daily CyberNews with no CVE-Report match' };
  const tf = s => encodeURIComponent(s).replace(/-/g, '%2D');
  const rowUrl = a => (ROW_CRIME.has(a.g) ? D.links.crime : D.links.state) + '#' + encodeURIComponent(a.sec || ROW_SECTION[a.g]).replace(/%20/g, '+')
    + ':~:text=' + tf(a.name) + (a.sfx ? ',-' + tf(a.sfx.replace(/[,;:]+$/, '')) : '');

  const TITLES = { ru: 'Russia', cn: 'China', kp: 'North Korea', ir: 'Iran · Gulf · South Asia', ot: 'Other / unattributed state actors',
    rw: 'Ransomware & extortion', cc: 'Cybercrime, botnets & campaigns', sp: 'Commercial spyware vendors',
    ns: 'State actors in the news, no CVE match', nc: 'Cybercrime in the news, no CVE match' };
  const ROWS = [['ru', 'cn', 'kp', 'ir', 'ot'], ['rw', 'cc', 'sp', 'ns', 'nc']];
  const TYPES = [['all', 'All'], ['apt', 'APT'], ['ransomware', 'Ransomware'], ['crime', 'Cybercrime'], ['spyware-vendor', 'Spyware'], ['cve', 'With CVEs']];
  const CRIME = new Set(['cybercrime', 'campaign', 'botnet', 'access-broker', 'extortion', 'fraud', 'phishing-kit', 'supply-chain', 'hacktivist']);
  const byId = Object.fromEntries(D.actors.map(a => [a.id, a]));
  const linked = D.actors.filter(a => a.cves.length);
  const nLinks = linked.reduce((n, a) => n + a.cves.length, 0);
  $('#meta').textContent = `${D.actors.length} actors · ${nLinks} actor→CVE links · updated ${D.updated.split('-').reverse().join('/')}`;
  $('#nav').innerHTML = [ext(D.links.index, 'Index'), ext(D.links.state, 'State-nexus'), ext(D.links.crime, 'Cybercrime'), ext(D.links.cveindex, 'CVE-Report'), ext(D.links.home, 'Koffei')].join('');

  // CVE -> actors
  const share = {};
  linked.forEach(a => a.cves.forEach(c => (share[c.id] = share[c.id] || { c, actors: [] }).actors.push(a.id)));
  const related = id => { const s = new Set(); byId[id].cves.forEach(c => share[c.id].actors.forEach(x => x !== id && s.add(x))); return [...s]; };

  // ---------- render board
  const world = $('#world'), board = $('#board'), edges = $('#edges');
  const cards = {};
  function cardHTML(a) {
    const max = 8, list = a.cves.slice(0, max).map(c => `<li>${ext(c.url, c.id, c.q ? 'sus' : '')}</li>`).join('')
      + (a.cves.length > max ? `<li><span class="more">+${a.cves.length - max}</span></li>` : '');
    const m = a.mitre ? ext(a.mitre.url, a.mitre.id, 'badge') : `<span class="badge">${a.mapped ? 'mapped' : 'no ATT&amp;CK'}</span>`;
    const foot = [a.techs.length ? `${a.techs.length} techniques` : '', a.seen.length ? `seen in ${a.seen.length} daily note${a.seen.length > 1 ? 's' : ''}` : '', a.kind ? esc(a.kind) : ''].filter(Boolean).join('</span><span>');
    return `<header><h3>${esc(a.name)}</h3>${m}</header>${a.alias ? `<p class="alias">${esc(a.alias)}</p>` : ''}
      <p class="country"><span class="dot"></span><span>${esc(a.country)}</span></p>
      ${a.cves.length ? `<ul class="cves">${list}</ul>` : `<p class="none">No CVE in the CVE-Report${a.notin.length ? ` (${a.notin.join(', ')} not in report)` : ''}</p>`}
      ${foot ? `<footer><span>${foot}</span></footer>` : ''}`;
  }
  const groupEls = {};
  ROWS.flat().forEach(k => {
    const members = D.actors.filter(a => a.g === k);
    const g = el('section', { class: 'group', style: `--gc: var(--g-${k})`, 'aria-label': TITLES[k] });
    g.innerHTML = `<h2>${esc(TITLES[k])} <small>${members.length}</small></h2>`;
    const colsWrap = el('div', { class: 'cols' }); const cols = [0, 1, 2].map(() => colsWrap.appendChild(el('div', { class: 'col' })));
    g.appendChild(colsWrap); world.appendChild(g); groupEls[k] = g;
    members.forEach(a => {
      const c = el('article', { class: 'card', tabindex: '0', 'data-id': a.id, style: `--gc: var(--g-${k})`, 'aria-label': a.name });
      c.innerHTML = cardHTML(a);
      const col = cols.reduce((m, x) => x.offsetHeight < m.offsetHeight ? x : m, cols[0]);
      col.appendChild(c); cards[a.id] = c;
    });
  });
  // hubs
  const top = Object.values(share).filter(s => s.actors.length >= 3).sort((x, y) => y.actors.length - x.actors.length || x.c.id.localeCompare(y.c.id));
  const hubs = el('section', { class: 'hubs' });
  hubs.innerHTML = `<h2>Most-shared exploits <small style="font-family:var(--f-mono);font-size:15px;color:var(--muted)">3+ actors</small></h2><div class="row">${top.map(s => `<div class="hub">${ext(s.c.url, s.c.id, 'id')}<p>${esc(s.c.vendor)} · ${esc(s.c.note)} · ${s.actors.length} actors</p>${s.actors.map(id => `<button data-go="${id}">${esc(byId[id].name)}</button>`).join('')}</div>`).join('')}</div>`;
  world.appendChild(hubs);

  function layout() {
    let y = 0, maxX = 0;

  function gZoom(f, cx = 0.5, cy = 0.5) { // f > 1 zooms in; (cx, cy) = focus point as a fraction of the view
    const w = Math.min(GEO.w, Math.max(GEO.w / 12, vb.w / f)), h = w * GEO.h / GEO.w;
    vb = { x: vb.x + (vb.w - w) * cx, y: vb.y + (vb.h - h) * cy, w, h }; gClamp(); setVB();
  }
  function gClamp() { vb.x = Math.max(0, Math.min(GEO.w - vb.w, vb.x)); vb.y = Math.max(0, Math.min(GEO.h - vb.h, vb.y)); }
  const frac = e => { const r = gsvg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  gsvg.addEventListener('wheel', e => { e.preventDefault(); gZoom(e.deltaY < 0 ? 1.25 : 0.8, ...frac(e)); }, { passive: false });
  gsvg.addEventListener('dblclick', e => { e.preventDefault(); gZoom(2, ...frac(e)); });
  $('#gz-in').onclick = () => gZoom(1.5); $('#gz-out').onclick = () => gZoom(1 / 1.5);
  $('#gz-fit').onclick = () => { vb = { x: 0, y: 0, w: GEO.w, h: GEO.h }; setVB(); };
  const gPtr = new Map(); let gPinch = null;
  gsvg.addEventListener('pointerdown', e => { gsvg.setPointerCapture(e.pointerId); gPtr.set(e.pointerId, { x: e.clientX, y: e.clientY }); gMoved = 0;
    if (gPtr.size === 2) { const [a, b] = [...gPtr.values()]; gPinch = Math.hypot(a.x - b.x, a.y - b.y); } });
  gsvg.addEventListener('pointermove', e => {
    const p = gPtr.get(e.pointerId); if (!p) return; const r = gsvg.getBoundingClientRect();
    if (gPtr.size === 2 && gPinch) { p.x = e.clientX; p.y = e.clientY; const [a, b] = [...gPtr.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      gZoom(d / gPinch, ((a.x + b.x) / 2 - r.left) / r.width, ((a.y + b.y) / 2 - r.top) / r.height); gPinch = d; gMoved += 10; return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; gMoved += Math.abs(dx) + Math.abs(dy);
    if (gMoved > 4) { gsvg.classList.add('panning'); vb.x -= dx * vb.w / r.width; vb.y -= dy * vb.h / r.height; gClamp(); setVB(); }
  });
  const gUp = e => { gPtr.delete(e.pointerId); if (gPtr.size < 2) gPinch = null; if (!gPtr.size) gsvg.classList.remove('panning'); };
  gsvg.addEventListener('pointerup', gUp); gsvg.addEventListener('pointercancel', gUp);
  gsvg.addEventListener('click', e => { if (gMoved > 4) return; const p = e.target.closest('path'); if (p) geoPick(p.dataset.iso); });
  gsvg.addEventListener('mouseover', e => { const p = e.target.closest('path'); if (p && geoC[p.dataset.iso]) setCap(esc(geoLabel(p.dataset.iso))); });
  gsvg.addEventListener('mouseleave', () => setCap(geoStatus + (cty ? ' <button data-clear>Clear</button>' : '')));
  gcap.addEventListener('click', e => { if (e.target.closest('[data-clear]') && cty) geoPick(cty); });
  [geo, $('#geo-on')].forEach(n => ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'wheel', 'dblclick'].forEach(ev => n.addEventListener(ev, e => e.stopPropagation(), { passive: true })));
  // floating window: off by default; the viewer's on/off choice, position and size are remembered in this browser
  const board_ = $('#board'), geoOn = $('#geo-on');
  const store = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } };
  function clampGeo() {
    const bw = board_.clientWidth, bh = board_.clientHeight;
    const w = Math.min(geo.offsetWidth, bw - 16), x = Math.max(8, Math.min(geo.offsetLeft, bw - w - 8)), y = Math.max(8, Math.min(geo.offsetTop, bh - geo.offsetHeight - 8));
    geo.style.width = w + 'px'; geo.style.left = x + 'px'; geo.style.top = y + 'px';
  }
  const saveGeo = () => store('geo-box', { x: geo.offsetLeft, y: geo.offsetTop, w: geo.offsetWidth });
  function geoShow(on) {
    geo.hidden = !on; geoOn.hidden = on; store('geo-on', on);
    if (on) { const b = load('geo-box'); if (b) { geo.style.left = b.x + 'px'; geo.style.top = b.y + 'px'; geo.style.width = b.w + 'px'; } clampGeo(); }
  }
  geoOn.onclick = () => geoShow(true);
  $('#geo-x').onclick = () => geoShow(false);
  // move by the title bar, resize from the corner grip (mouse, pen and touch)
  function dragWith(handle, cls, onMove) {
    handle.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      e.preventDefault(); handle.setPointerCapture(e.pointerId); geo.classList.add(cls);
      const s0 = { x: e.clientX, y: e.clientY, l: geo.offsetLeft, t: geo.offsetTop, w: geo.offsetWidth };
      const mv = ev => onMove(ev.clientX - s0.x, ev.clientY - s0.y, s0);
      const end = () => { geo.classList.remove(cls); handle.removeEventListener('pointermove', mv); clampGeo(); saveGeo(); };
      handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', end, { once: true }); handle.addEventListener('pointercancel', end, { once: true });
    });
  }
  dragWith($('#geo-bar'), 'dragging', (dx, dy, s0) => { geo.style.left = s0.l + dx + 'px'; geo.style.top = s0.t + dy + 'px'; });
  dragWith($('#geo-grip'), 'sizing', (dx, dy, s0) => { geo.style.width = Math.max(260, Math.min(board_.clientWidth - s0.l - 8, s0.w + Math.max(dx, dy * GEO.w / GEO.h))) + 'px'; });
  window.addEventListener('resize', () => { if (!geo.hidden) clampGeo(); });
  geoShow(load('geo-on') === true);

  // ---------- search + filters
  let type = 'all';
  const chips = $('#chips');
  TYPES.forEach(([k, label]) => { const b = el('button', { class: 'chip', 'aria-pressed': k === 'all' ? 'true' : 'false', 'data-k': k }, label); chips.appendChild(b); });
  chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; type = b.dataset.k; chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); filter(); });
  const hay = Object.fromEntries(D.actors.map(a => [a.id, [a.name, a.alias, a.country, a.type, a.kind, a.ctx, a.mitre?.id || '', a.techs.join(' '), a.cves.map(c => c.id + ' ' + c.vendor).join(' '), a.tags.join(' ')].join(' ').toLowerCase()]));
  function match(a, q) {
    if (cty && !(ORIGIN[originOf(a)] || []).includes(cty)) return false;
    const tOk = type === 'all' || (type === 'cve' ? a.cves.length > 0 : type === 'crime' ? CRIME.has(a.type) : a.type === type);
    return tOk && (!q || q.split(/\s+/).every(w => hay[a.id].includes(w)));
  }
  function filter(zoom) {
    const q = $('#q').value.trim().toLowerCase(); let n = 0, first = null;
    D.actors.forEach(a => { const ok = match(a, q); cards[a.id].classList.toggle('dim', !ok); if (ok) { n++; first = first || a.id; } });
    $('#count').textContent = `${n} / ${D.actors.length}`;
    if (zoom && first) { select(first); focusCard(first); }
  }
  $('#q').addEventListener('input', () => filter());
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') filter(true); });

  // ---------- start
  filter(); geoMark(null);
  const start = () => { layout(); const h = (location.hash || '').slice(1); if (h && byId[h]) { select(h); focusCard(h); } else fit(); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
  start();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (selected) drawEdges(selected); }, 120); });
})();
</script>
