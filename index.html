<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Koffei Threat Actor Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: an investigation board. A fixed top bar, an infinite pannable board of group regions holding actor cards, and a detail drawer (right on desktop, bottom sheet on phones).
   Visual style: KDE Plasma Breeze (light) / Breeze Dark — Window/View/Button colours, Noto Sans,
   with a purple accent (rgb 139,46,173) like picking a custom accent colour in Plasma System Settings. */
:root {
  --bg: #eff0f1; --dot: #d1d5d9; --surface: #ffffff; --surface-2: #f7f8f9;
  --ink: #232629; --muted: #5f6a73; --line: #c3c7cb; --accent: #2980b9; --accent-ink: #ffffff;
  --pu: 139,46,173; --link: #1e8449; --hl: #8b2ead; --hl-soft: rgba(139,46,173,.12); --sus: #c45c00;
  --g-ru: #da4453; --g-cn: #d35400; --g-kp: #8e44ad; --g-ir: #1e8449; --g-ot: #2980b9;
  --g-rw: #c0306a; --g-cc: #a67c00; --g-sp: #a0399a; --g-ns: #7f8c8d; --g-nc: #7f8c8d;
  --f-display: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Hack", "Noto Sans Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 5px; --r-frame: 8px;
  --shadow: 0 1px 2px rgba(35,38,41,.10), 0 2px 6px rgba(35,38,41,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141618; --dot: #2a2e32; --surface: #202326; --surface-2: #292c30;
  --ink: #fcfcfc; --muted: #a1a9b1; --line: #3b4045; --accent: #1d99f3; --accent-ink: #fcfcfc;
  --pu: 139,46,173; --link: #2ecc71; --hl: #a24cc4; --hl-soft: rgba(162,76,196,.20); --sus: #f67400;
  --g-ru: #ed5e6b; --g-cn: #f67400; --g-kp: #b07fd8; --g-ir: #2ecc71; --g-ot: #1d99f3;
  --g-rw: #e93a9a; --g-cc: #fdbc4b; --g-sp: #d27ccb; --g-ns: #a1a9b1; --g-nc: #a1a9b1;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141618; --dot: #2a2e32; --surface: #202326; --surface-2: #292c30;
  --ink: #fcfcfc; --muted: #a1a9b1; --line: #3b4045; --accent: #1d99f3; --accent-ink: #fcfcfc;
  --pu: 139,46,173; --link: #2ecc71; --hl: #a24cc4; --hl-soft: rgba(162,76,196,.20); --sus: #f67400;
  --g-ru: #ed5e6b; --g-cn: #f67400; --g-kp: #b07fd8; --g-ir: #2ecc71; --g-ot: #1d99f3;
  --g-rw: #e93a9a; --g-cc: #fdbc4b; --g-sp: #d27ccb; --g-ns: #a1a9b1; --g-nc: #a1a9b1;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; overflow: hidden; }
a { color: var(--accent); }
:focus-visible { outline: 1px solid var(--hl); outline-offset: 1px; }
::selection { background: var(--hl); color: #fff; }
.app { display: flex; flex-direction: column; height: 100%; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 19px; letter-spacing: 0; margin: 0; white-space: nowrap; }
.brand .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 0 10px; }
.search:focus-within { border-color: var(--hl); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; padding: 8px 0; outline: none; }
.search .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 400 13px/1 var(--f-body); padding: 7px 11px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; box-shadow: var(--shadow); }
.chip:hover { border-color: var(--hl); background: var(--hl-soft); }
.chip[aria-pressed="true"] { background: var(--hl); color: #fff; border-color: var(--hl); }
.navlinks { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
.navlinks a { text-decoration: none; }
.navlinks a:hover { text-decoration: underline; }

/* board */
.board { position: relative; flex: 1; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 22px 22px; }
.board.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edges line { stroke: var(--hl); stroke-width: 2.5; stroke-dasharray: 6 5; opacity: .85; }
.edges polyline { stroke: var(--link); stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }

.group { position: absolute; width: 1490px; padding: 18px 22px 24px; border-radius: var(--r-frame);
  background: color-mix(in srgb, var(--gc) 6%, transparent); border: 1.5px solid color-mix(in srgb, var(--gc) 35%, transparent); }
.group > h2 { margin: 0 0 18px; font-family: var(--f-display); font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: -.01em; color: var(--gc); display: flex; align-items: baseline; gap: 12px; }
.group > h2 small { font-family: var(--f-mono); font-weight: 500; font-size: 26px; color: var(--muted); }
.cols { display: flex; gap: 18px; align-items: flex-start; }
.col { flex: 1; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-frame); padding: 14px 16px 12px; box-shadow: var(--shadow); cursor: pointer; transition: opacity .15s, box-shadow .15s, transform .15s; }
.card:hover { border-color: var(--hl); background: color-mix(in srgb, var(--hl) 6%, var(--surface)); }
.card.sel { border-color: var(--hl); box-shadow: 0 0 0 2px var(--hl), var(--shadow); }
.card.rel { border-color: color-mix(in srgb, var(--hl) 70%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--hl) 60%, transparent), var(--shadow); }
.card.dim { opacity: .22; }
.card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.card h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.1; text-wrap: balance; }
.badge { font-family: var(--f-mono); font-size: 12px; padding: 3px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-decoration: none; }
a.badge { color: var(--ink); }
.alias { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.country { margin: 8px 0 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.country .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gc); flex: none; transform: translateY(-1px); }
.cves { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 5px; }
.cves a, .cves span { font-family: var(--f-mono); font-size: 12px; padding: 3px 6px; border-radius: 4px; text-decoration: none; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); display: inline-block; }
.cves a.sus { border-style: dashed; border-color: var(--sus); color: var(--sus); background: color-mix(in srgb, var(--sus) 7%, var(--surface)); }
.cves a:hover { text-decoration: underline; }
.cves .more { color: var(--muted); border-color: var(--line); background: transparent; }
.card footer { margin-top: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.none { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

.hubs { position: absolute; padding: 18px 22px 24px; border-radius: var(--r-frame); border: 1.5px dashed var(--line); }
.hubs > h2 { margin: 0 0 18px; font-family: var(--f-display); font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -.01em; }
.hubs .row { display: flex; gap: 16px; flex-wrap: wrap; width: 1446px; }
.hub { width: 350px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-frame); padding: 14px 16px; box-shadow: var(--shadow); }
.hub a.id { font-family: var(--f-mono); font-size: 16px; font-weight: 500; }
.hub p { margin: 4px 0 8px; color: var(--muted); font-size: 13px; }
.hub button { font: 400 13px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); padding: 3px 7px; margin: 0 4px 4px 0; cursor: pointer; }

/* zoom controls */
.zoom { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; z-index: 4; }
.zoom button { width: 38px; height: 38px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 600 18px var(--f-body); cursor: pointer; box-shadow: var(--shadow); }
.zoom .pct { font-family: var(--f-mono); font-size: 11px; text-align: center; color: var(--muted); }
.hint { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; z-index: 4; max-width: calc(100% - 100px); }

/* Breeze button hover: highlight border + light highlight fill */
.hub button:hover, .rel button:hover, .zoom button:hover, .drawer .close:hover { border-color: var(--hl); background: var(--hl-soft); }
.hub button:active, .rel button:active, .zoom button:active { background: var(--hl); color: #fff; }

/* drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -4px 0 16px rgba(0,0,0,.14); z-index: 6; overflow-y: auto; padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.drawer .close { position: sticky; top: 0; float: right; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); width: 32px; height: 32px; font-size: 17px; cursor: pointer; }
.drawer .eyebrow { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--gc); margin: 0; }
.drawer h2 { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.05; margin: 4px 0 4px; text-wrap: balance; }
.drawer .alias { -webkit-line-clamp: unset; font-size: 14px; }
.drawer h4 { font: 600 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; margin: 14px 0 0; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.clist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.clist li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; font-size: 13.5px; }
.clist a { font-family: var(--f-mono); font-size: 13px; }
.clist .q { grid-column: 2; color: var(--sus); font-size: 12.5px; }
.clist .v { color: var(--muted); }
.techs { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; }
.techs a { font-family: var(--f-mono); font-size: 12.5px; text-decoration: none; display: inline-block; min-width: 82px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tags code { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.ctx { font-size: 14.5px; line-height: 1.5; margin: 0; }
.rel button { font: 400 13px var(--f-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: var(--r); padding: 4px 8px; margin: 0 5px 5px 0; cursor: pointer; }
.drawer .src { margin-top: 20px; font-size: 13.5px; }


/* Purple accent: fading gradients on buttons and blocks */
.chip, .zoom button, .hub button, .rel button, .drawer .close {
  background: linear-gradient(180deg, rgba(var(--pu),.16), rgba(var(--pu),.03)), var(--surface-2);
  border-color: color-mix(in srgb, var(--hl) 35%, var(--line)); }
.chip:hover, .zoom button:hover, .hub button:hover, .rel button:hover, .drawer .close:hover {
  background: linear-gradient(180deg, rgba(var(--pu),.30), rgba(var(--pu),.08)), var(--surface-2); border-color: var(--hl); }
.chip[aria-pressed="true"], .hub button:active, .rel button:active, .zoom button:active {
  background: linear-gradient(180deg, #a347c7, #8b2ead 60%, #74238f); color: #fff; border-color: #74238f; }
.card, .hub { background: linear-gradient(180deg, rgba(var(--pu),.10), rgba(var(--pu),0) 60%), var(--surface); }
.card:hover { background: linear-gradient(180deg, rgba(var(--pu),.18), rgba(var(--pu),.02) 70%), var(--surface); }
.card.sel { background: linear-gradient(180deg, rgba(var(--pu),.22), rgba(var(--pu),.04) 70%), var(--surface); }
.hubs { border-color: color-mix(in srgb, var(--hl) 40%, var(--line)); background: linear-gradient(180deg, rgba(var(--pu),.07), rgba(var(--pu),0) 40%); }
.drawer { background: linear-gradient(180deg, rgba(var(--pu),.12), rgba(var(--pu),0) 220px), var(--surface); }
.search, .hint { background: linear-gradient(180deg, rgba(var(--pu),.05), rgba(var(--pu),0)), var(--surface); }
.badge, .tags code { background: linear-gradient(180deg, rgba(var(--pu),.12), rgba(var(--pu),.03)), var(--surface-2); }

@media (max-width: 720px) {
  .brand .meta, .navlinks { display: none; }
  .drawer { top: auto; height: 62%; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: var(--r-frame) var(--r-frame) 0 0; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>

</div>

    const xs = new Set([S0[0]]), ys = new Set([P[1]]);
    groups.forEach(g => { xs.add(g.l - GG); xs.add(g.r + GG); ys.add(g.t - GG); ys.add(g.b + GG); });
    obs.forEach(o => { if ([...own].some(g => inside(cx(o), cy(o), g))) { xs.add(o.l - CG); xs.add(o.r + CG); ys.add(o.t - CG); ys.add(o.b + CG); } });
    const ports = rel.map(B => { const fromLeft = cx(B) >= P[0]; const T = [fromLeft ? B.l : B.r, cy(B)]; ys.add(T[1]); xs.add(T[0] + (fromLeft ? -CG : CG)); return { B, T, T0: [T[0] + (fromLeft ? -CG : CG), T[1]], dir: fromLeft ? 0 : 1 }; });
    const X = [...xs].sort((a, b) => a - b), Y = [...ys].sort((a, b) => a - b), nx = X.length, idx = (i, j) => j * nx + i;
    // edge weights: dir 0 = +x from node (i,j) to (i+1,j); dir 2 = +y to (i,j+1); Infinity = blocked
    // per edge: length (Infinity = blocked by a card) and the group block it runs through (-1 = outside)
    const wH = new Float64Array(nx * Y.length).fill(Infinity), wV = new Float64Array(nx * Y.length).fill(Infinity);
    const gH = new Int16Array(nx * Y.length), gV = new Int16Array(nx * Y.length);
    const seg = (p, q, k, W, G) => { if (obs.some(o => hits(p, q, o))) return; W[k] = Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]); G[k] = groups.findIndex(g => inside((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, g)); };
    for (let j = 0; j < Y.length; j++) for (let i = 0; i < nx; i++) {
      if (i + 1 < nx) seg([X[i], Y[j]], [X[i + 1], Y[j]], idx(i, j), wH, gH);
      if (j + 1 < Y.length) seg([X[i], Y[j]], [X[i], Y[j + 1]], idx(i, j), wV, gV);
    }
    const gOf = c => groups.findIndex(g => inside(cx(c), cy(c), g)), gA = gOf(A);
    const shared = new Set(); // "H:k" / "V:k" edges already drawn from this port
    const start = idx(X.indexOf(S0[0]), Y.indexOf(S0[1]));
    ports.forEach(({ B, T, T0, dir: endDir }) => {
      const gB = gOf(B); // only the selected card's group and this target's group are cheap to cross
      const goal = idx(X.indexOf(T0[0]), Y.indexOf(T0[1])), N = nx * Y.length, dist = new Float64Array(N * 4).fill(Infinity), prev = new Int32Array(N * 4).fill(-1), h = [];
      const s0 = start * 4 + (right ? 0 : 1); dist[s0] = 0; heapPush(h, [0, s0]); let end = -1;
      while (h.length) {
        const [d, st] = heapPop(h); if (d > dist[st]) continue; const n = st >> 2, dr = st & 3;
        if (n === goal) { if (dr === endDir) { end = st; break; } if (end < 0) end = st; continue; } // prefer arriving straight into the port
        const i = n % nx, j = (n / nx) | 0;
        for (const [nd, m, k, key] of [[0, i + 1 < nx ? idx(i + 1, j) : -1, n, 'H'], [1, i ? idx(i - 1, j) : -1, i ? idx(i - 1, j) : 0, 'H'], [2, j + 1 < Y.length ? idx(i, j + 1) : -1, n, 'V'], [3, j ? idx(i, j - 1) : -1, j ? idx(i, j - 1) : 0, 'V']]) {
          if (m < 0) continue; let w = (key === 'H' ? wH : wV)[k]; if (w === Infinity) continue;
          const g = (key === 'H' ? gH : gV)[k]; if (g >= 0) w *= g === gA || g === gB ? W_OWN : W_OTHER;
          if (shared.has(key + k)) w *= W_SHARED;
          const c = d + w + (nd === dr ? 0 : TURN), ns = m * 4 + nd; if (c < dist[ns]) { dist[ns] = c; prev[ns] = st; heapPush(h, [c, ns]); }
        }
      }
      let l;
      if (end < 0) { l = document.createElementNS(NS, 'line'); l.setAttribute('x1', P[0]); l.setAttribute('y1', P[1]); l.setAttribute('x2', T[0]); l.setAttribute('y2', T[1]); }
      else {
        const nodes = []; for (let st = end; st >= 0; st = prev[st]) nodes.push(st >> 2); nodes.reverse();
        for (let k = 1; k < nodes.length; k++) { const a = nodes[k - 1], b = nodes[k]; const lo = Math.min(a, b); shared.add((Math.abs(a - b) === 1 ? 'H' : 'V') + lo); }
        const pts = [P, ...nodes.map(n => [X[n % nx], Y[(n / nx) | 0]]), T].filter((p, k, a) => !k || p[0] !== a[k - 1][0] || p[1] !== a[k - 1][1])
          .filter((p, k, a) => k === 0 || k === a.length - 1 || !((a[k - 1][0] === p[0] && p[0] === a[k + 1][0]) || (a[k - 1][1] === p[1] && p[1] === a[k + 1][1])));
        l = document.createElementNS(NS, 'polyline'); l.setAttribute('points', pts.map(p => p.join(',')).join(' '));
      }
      edges.appendChild(l);
    });
  }
  function select(id) {
    selected = id; const rel = id ? new Set(related(id)) : new Set();
    Object.entries(cards).forEach(([k, c]) => { c.classList.toggle('sel', k === id); c.classList.toggle('rel', rel.has(k)); });
    drawEdges(id); renderDrawer(id);
    try { history.replaceState(null, '', id ? '#' + id : location.pathname + location.search); } catch (_) {}
  }
  function renderDrawer(id) {
    const d = $('#drawer'); if (!id) { d.hidden = true; return; }
    const a = byId[id]; d.style.setProperty('--gc', `var(--g-${a.g})`);
    const rel = related(id);
    d.innerHTML = `<button class="close" id="dclose" aria-label="Close details">×</button>
      <p class="eyebrow">${esc(TITLES[a.g])}</p><h2>${esc(a.name)}</h2>${a.alias ? `<p class="alias">${esc(a.alias)}</p>` : ''}
      <dl class="kv"><dt>Country</dt><dd>${esc(a.country)}</dd><dt>Type</dt><dd>${esc(a.kind || a.type.replace(/-/g, ' '))}</dd>
      <dt>MITRE</dt><dd>${a.mitre ? ext(a.mitre.url, (a.mitre.id.startsWith('C') ? 'Campaign ' : 'Group ') + a.mitre.id) : (a.mapped ? 'Not in ATT&amp;CK, techniques mapped from reporting' : 'Not in ATT&amp;CK')}</dd></dl>
      <h4>CVEs in the CVE-Report (${a.cves.length})</h4>
      ${a.cves.length ? `<ul class="clist">${a.cves.map(c => `<li>${ext(c.url, c.id)}<span class="v">${esc(c.vendor)} · ${esc(c.note.replace('CVE-Report-', ''))}</span>${c.q ? `<span class="q">${esc(c.q)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="none" style="margin:0">None.</p>'}
      ${a.notin.length ? `<p class="none">Known but not in the report: ${a.notin.map(esc).join(', ')}</p>` : ''}
      ${rel.length ? `<h4>Shares CVEs with</h4><div class="rel">${rel.map(r => `<button data-go="${r}">${esc(byId[r].name)}</button>`).join('')}</div>` : ''}
      ${a.ctx && a.ctx !== '—' ? `<h4>Context</h4><p class="ctx">${esc(a.ctx)}</p>` : ''}
      ${a.techs.length ? `<h4>ATT&amp;CK v19 techniques${a.mapped ? ' (mapped)' : ''}</h4><div class="techs">${a.techs.map(t => { const id = t.replace(' (M)', ''); const p = id.split('.');
        const url = 'https://attack.mitre.org/techniques/' + p[0] + (p[1] ? '/' + p[1] : '') + '/'; return `<div>${ext(url, esc(t))} ${esc(D.legend[id] || '')}</div>`; }).join('')}</div>` : ''}
      ${a.seen.length || a.seenCveNotes ? `<h4>Seen in Daily CyberNews</h4><div class="techs" style="flex-direction:row;flex-wrap:wrap;gap:6px 12px">${a.seen.map(x => ext(x.url, x.d.split('-').reverse().join('/'))).join('')}${a.seenCveNotes ? ext(D.links.cveindex, 'CVE-Report notes') : ''}</div>` : ''}
      <h4>Tags</h4><div class="tags">${a.tags.map(t => `<code>${esc(t)}</code>`).join('')}</div>
      <p class="src">Full row: ${ext(rowUrl(a), ROW_CRIME.has(a.g) ? 'Threat-Actors-Cybercrime-and-Spyware' : 'Threat-Actors-State-Nexus')}</p>`;
    d.hidden = false; d.scrollTop = 0;
    $('#dclose').onclick = () => select(null);
    d.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { select(b.dataset.go); focusCard(b.dataset.go); });
  }
  world.addEventListener('keydown', e => { const c = e.target.closest('.card'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(c.dataset.id); focusCard(c.dataset.id); } });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input')) { if (e.key === 'Escape') { e.target.value = ''; filter(); } return; }
    if (e.key === 'Escape') select(null);
    if (e.key === '+' || e.key === '=') $('#zin').click(); if (e.key === '-') $('#zout').click(); if (e.key === '0') fit();
  });

  // ---------- search + filters
  let type = 'all';
  const chips = $('#chips');
  TYPES.forEach(([k, label]) => { const b = el('button', { class: 'chip', 'aria-pressed': k === 'all' ? 'true' : 'false', 'data-k': k }, label); chips.appendChild(b); });
  chips.addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; type = b.dataset.k; chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); filter(); });
  const hay = Object.fromEntries(D.actors.map(a => [a.id, [a.name, a.alias, a.country, a.type, a.kind, a.ctx, a.mitre?.id || '', a.techs.join(' '), a.cves.map(c => c.id + ' ' + c.vendor).join(' '), a.tags.join(' ')].join(' ').toLowerCase()]));
  function match(a, q) {
    const tOk = type === 'all' || (type === 'cve' ? a.cves.length > 0 : type === 'crime' ? CRIME.has(a.type) : a.type === type);
    return tOk && (!q || q.split(/\s+/).every(w => hay[a.id].includes(w)));
  }
  function filter(zoom) {
    const q = $('#q').value.trim().toLowerCase(); let n = 0, first = null;
    D.actors.forEach(a => { const ok = match(a, q); cards[a.id].classList.toggle('dim', !ok); if (ok) { n++; first = first || a.id; } });
    $('#count').textContent = `${n} / ${D.actors.length}`;
    if (zoom && first) { select(first); focusCard(first); }
  }
  $('#q').addEventListener('input', () => filter());
  $('#q').addEventListener('keydown', e => { if (e.key === 'Enter') filter(true); });

  // ---------- start
  filter();
  const start = () => { layout(); const h = (location.hash || '').slice(1); if (h && byId[h]) { select(h); focusCard(h); } else fit(); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
  start();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (selected) drawEdges(selected); }, 120); });
})();
</script>
